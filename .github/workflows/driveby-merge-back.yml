name: DriveBy Merge Back
on:
  pull_request:
    types: [closed]
    branches:
      - environment/prod
permissions:
  contents: write
jobs:
  merge-back:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Find and merge RC branch
        run: |
          git config user.name "driveby-bot"
          git config user.email "driveby-bot@users.noreply.github.com"
          # Find the latest RC branch
          RC_BRANCH=$(git branch -r --list 'origin/rc-*' --sort=-committerdate | head -1 | sed 's|origin/||' | xargs)
          if [ -z "$RC_BRANCH" ]; then
            echo "No RC branch found, skipping merge-back"
            exit 0
          fi
          VERSION=$(echo "$RC_BRANCH" | sed 's/^rc-//')
          echo "Merging ${RC_BRANCH} back to main and tagging v${VERSION}"
          git checkout main
          git merge "origin/${RC_BRANCH}" --no-ff -m "Merge ${RC_BRANCH} after prod promotion"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin main --tags
          git push origin --delete "${RC_BRANCH}" || true
